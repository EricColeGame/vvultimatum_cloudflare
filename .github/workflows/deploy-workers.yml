name: Build and Deploy to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    # Never deploy from the public mirror (EricColeGame/vvultimatum_cloudflare);
    # template copies under other owners deploy normally with their own secrets.
    if: github.repository != 'EricColeGame/vvultimatum_cloudflare'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SITE_URL: https://vvultimatum.sbs
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          NEXT_PUBLIC_MICROSOFT_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_MICROSOFT_CLARITY_ID }}
          NEXT_PUBLIC_GOOGLE_ADSENSE_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADSENSE_ID }}
          NEXT_PUBLIC_AD_SOCIAL_BAR: ${{ secrets.NEXT_PUBLIC_AD_SOCIAL_BAR }}
          NEXT_PUBLIC_AD_NATIVE_BANNER: ${{ secrets.NEXT_PUBLIC_AD_NATIVE_BANNER }}
          NEXT_PUBLIC_AD_BANNER_728X90: ${{ secrets.NEXT_PUBLIC_AD_BANNER_728X90 }}
          NEXT_PUBLIC_AD_BANNER_300X250: ${{ secrets.NEXT_PUBLIC_AD_BANNER_300X250 }}
          NEXT_PUBLIC_AD_BANNER_468X60: ${{ secrets.NEXT_PUBLIC_AD_BANNER_468X60 }}
          NEXT_PUBLIC_AD_SIDEBAR_160X600: ${{ secrets.NEXT_PUBLIC_AD_SIDEBAR_160X600 }}
          NEXT_PUBLIC_AD_SIDEBAR_160X300: ${{ secrets.NEXT_PUBLIC_AD_SIDEBAR_160X300 }}
          NEXT_PUBLIC_AD_MOBILE_320X50: ${{ secrets.NEXT_PUBLIC_AD_MOBILE_320X50 }}
          NEXT_PUBLIC_ADSTERRA_NATIVE_URL: ${{ secrets.NEXT_PUBLIC_ADSTERRA_NATIVE_URL }}
          NEXT_PUBLIC_ADSTERRA_NATIVE_HOST: ${{ secrets.NEXT_PUBLIC_ADSTERRA_NATIVE_HOST }}

      - name: Serve default locale at site root
        run: |
          if [ -f out/en/index.html ]; then cp -f out/en/index.html out/index.html
          elif [ -f out/en.html ]; then cp -f out/en.html out/index.html
          else echo "en homepage export not found"; find out -maxdepth 2 -name '*.html' | head -20; exit 1; fi

      - name: Inject analytics (GA/Clarity) into HTML
        env:
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          NEXT_PUBLIC_MICROSOFT_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_MICROSOFT_CLARITY_ID }}
        run: |
          python3 - <<'PYEOF'
          import os, pathlib
          ga = os.environ.get("NEXT_PUBLIC_GOOGLE_ANALYTICS_ID", "").strip()
          cl = os.environ.get("NEXT_PUBLIC_MICROSOFT_CLARITY_ID", "").strip()
          ga_s = ""
          if ga:
              ga_s = ('<script async src="https://www.googletagmanager.com/gtag/js?id=%s"></script>'
                      '<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)};'
                      'gtag("js",new Date());gtag("config","%s");</script>') % (ga, ga)
          cl_s = ""
          if cl:
              cl_s = ('<script>(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};'
                      't=l.getElementsByTagName(r)[0];y=l.createElement(a);y.async=1;y.src="https://www.clarity.ms/tag/"+i;'
                      'y.referrerPolicy="unsafe-url";t.parentNode.insertBefore(y,t)})(window,document,"clarity","script","%s");</script>') % cl
          n = 0
          for f in pathlib.Path("out").rglob("*.html"):
              html = f.read_text(encoding="utf-8")
              add = ""
              if ga_s and "googletagmanager.com/gtag" not in html:
                  add += ga_s
              if cl_s and "clarity.ms/tag" not in html:
                  add += cl_s
              if add and "</head>" in html:
                  f.write_text(html.replace("</head>", add + "</head>", 1), encoding="utf-8")
                  n += 1
          print("analytics injected into", n, "html files")
          PYEOF

      - name: Deploy to Cloudflare Workers
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
